<html>
    <head>
        <title>My Zoo Tracker</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f8f9fa;
                margin: 0;
                padding: 0;
            }
            h1{
                color:pink;
            }
            #zoo {
                border: 2px solid #ff5A43;
                width: 300px;
                margin: 16px auto;
                padding: 12px;
                border-radius:10px;
                background-color: lightgreen;
            }
            .zone {
                border: 1px solid #ff5a43;
                color: black;
                padding: 10px 24px;
                border-radius:20px;
                cursor: pointer;
            }
            .animal {
                font-weight: bold;
            }
            button {
                background-color: #ff5A43;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }   
            #output{
                color: #333;
                font-size: 14px;
                font-family: Arial, sans-serif;
            }
            paragraph{
                color:bisque;
                font-size: 16px;
                text-shadow: 1px 1px 2px #ff5A43;
            }
        </style>        
    </head>
    <body>
        <h1>My Zoo Tracker</h1>
        <p><i>Use JavaScript and the DOM to track animals in each zone!</i></p>
        <div id="zoo">
            <div class="zone"> Zone 1: <span id="zone1" class="animal"></span> </div>
            <div class="zone"> Zone 2: <span id="zone2" class="animal"></span> </div>
            <div class="zone"> Zone 3: <span id="zone3" class="animal"></span> </div>
            <div class="zone"> Total Animals: <span id="total" class="animal"></span> </div>
            </div>
            <br>
            <button onclick="openZoo()">Open the Zoo</button>
            <p id="output"></p>
            <script>
                function openZoo() {
                    document.getElementById("zone1").innerHTML = "Lion:gate no 2" ;
                    document.getElementById("zone2").innerHTML = "Elephant:near the Lake";
                    document.getElementById("zone3").innerHTML = "Penguin:cold zone";
                    document.getElementById("total").innerHTML = "3";
                    document.getElementById("zoo").style.backgroundColor = "lightblue";
                  
                }
</script>
    </body>
</html>
